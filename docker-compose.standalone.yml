services:
  blackhole-pool:
    build:
      context: ./pool
      args:
        BUILD_GIT_SHA: ${BUILD_GIT_SHA:-unknown}
        BUILD_GIT_DIRTY: ${BUILD_GIT_DIRTY:-unknown}
        BUILD_SOURCE: ${BUILD_SOURCE:-docker-compose}
        BUILD_TIME_UTC: ${BUILD_TIME_UTC:-unknown}
        BUILD_IMAGE_ID: ${BUILD_IMAGE_ID:-unknown}
    env_file: ./env/.env
    environment:
      RUNTIME_IMAGE_REF: ${RUNTIME_IMAGE_REF:-blackhole-blackhole-pool:latest}
      RUNTIME_IMAGE_ID: ${RUNTIME_IMAGE_ID:-unknown}
      RUNTIME_CONTAINER_NAME: ${RUNTIME_CONTAINER_NAME:-blackhole-blackhole-pool-1}
    cpuset: "2-3"
    network_mode: host
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      autoheal: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z 127.0.0.1 \"$${STRATUM_PORT}\" && ( [ \"$${API_ENABLED}\" != \"true\" ] || nc -z 127.0.0.1 \"$${API_PORT}\" )",
        ]
      interval: 30s
      timeout: 3s
      retries: 20
    volumes:
      - pool_data:/data

  blackhole-dashboard:
    build:
      context: ./dashboard
    network_mode: host
    restart: unless-stopped
    depends_on:
      - blackhole-pool

  blockfinder-autoheal:
    image: docker:cli
    restart: unless-stopped
    environment:
      AUTOHEAL_INTERVAL_SECS: ${AUTOHEAL_INTERVAL_SECS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/autoheal.sh:/usr/local/bin/autoheal.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/autoheal.sh"]

volumes:
  pool_data:
    name: blackhole_pool_data
