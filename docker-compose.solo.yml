services:
  blockfinder-pool:
    build:
      context: ./pool
      args:
        BUILD_GIT_SHA: ${BUILD_GIT_SHA:-unknown}
        BUILD_GIT_DIRTY: ${BUILD_GIT_DIRTY:-unknown}
        BUILD_SOURCE: ${BUILD_SOURCE:-docker-compose}
        BUILD_TIME_UTC: ${BUILD_TIME_UTC:-unknown}
        BUILD_IMAGE_ID: ${BUILD_IMAGE_ID:-unknown}
    env_file: ./env/.env
    environment:
      RUNTIME_IMAGE_REF: ${RUNTIME_IMAGE_REF:-blockfinder-blockfinder-pool:latest}
      RUNTIME_IMAGE_ID: ${RUNTIME_IMAGE_ID:-unknown}
      RUNTIME_CONTAINER_NAME: ${RUNTIME_CONTAINER_NAME:-blockfinder-blockfinder-pool-1}
      SOLO_MODE: "${SOLO_MODE:-true}"
      API_ENABLED: "${API_ENABLED:-false}"
      PERSIST_SHARES: "${PERSIST_SHARES:-false}"
      PERSIST_BLOCKS: "${PERSIST_BLOCKS:-true}"
      PERSIST_BEST: "${PERSIST_BEST:-true}"
      BEST_PERSIST_INTERVAL_SECS: "${BEST_PERSIST_INTERVAL_SECS:-10}"
      STRATUM_PORT: "${STRATUM_PORT:-3333}"
      API_PORT: "${API_PORT:-8080}"
      TARGET_SHARE_TIME_SECS: "${TARGET_SHARE_TIME_SECS:-15}"
      VARDIFF_RETARGET_SECS: "${VARDIFF_RETARGET_SECS:-30}"
      MIN_DIFFICULTY: "${MIN_DIFFICULTY:-8192}"
      MAX_DIFFICULTY: "${MAX_DIFFICULTY:-16777216}"
      STRATUM_START_DIFFICULTY: "${STRATUM_START_DIFFICULTY:-32768}"
      RECONNECT_RECENT_SECS: "${RECONNECT_RECENT_SECS:-15}"
      EXTRANONCE1_SIZE: "${EXTRANONCE1_SIZE:-4}"
      EXTRANONCE2_SIZE: "${EXTRANONCE2_SIZE:-8}"
      TEMPLATE_MAX_AGE_SECS: "${TEMPLATE_MAX_AGE_SECS:-20}"
    network_mode: host
    restart: unless-stopped
    cpuset: "${POOL_CPUSET:-2-3}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      autoheal: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z 127.0.0.1 \"$${STRATUM_PORT}\" && ( [ \"$${API_ENABLED}\" != \"true\" ] || nc -z 127.0.0.1 \"$${API_PORT}\" )",
        ]
      interval: 30s
      timeout: 3s
      retries: 20
    volumes:
      - pool_data:/data

  blockfinder-dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
    network_mode: host
    restart: unless-stopped
    depends_on:
      - blockfinder-pool

  blockfinder-autoheal:
    image: docker:cli
    restart: unless-stopped
    environment:
      AUTOHEAL_INTERVAL_SECS: ${AUTOHEAL_INTERVAL_SECS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/autoheal.sh:/usr/local/bin/autoheal.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/autoheal.sh"]

volumes:
  pool_data:
    name: blockfinder_pool_data
